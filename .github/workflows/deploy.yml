name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: read the repo, publish the artifact,
# and mint the OIDC token the deployment is verified with.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve public base path
        id: base
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ] || [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            # Custom domain or user/org site — the app lives at the root.
            base="/"
          else
            # Project site — Pages serves it from https://<owner>.github.io/<repo>/
            base="/$repo/"
          fi
          echo "Building with base $base"
          echo "value=$base" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
          VITE_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
